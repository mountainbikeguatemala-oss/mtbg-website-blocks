# Tour photo service for the NAS. Start with:  docker compose --env-file config.env up -d --build
# (--env-file lets this file read UPLOAD_PORT; both containers read every setting from config.env.)
# The secure office address (https, for uploads straight from the Staff App) is a separate project in tls/: it
# reaches the upload page as tour-photos-upload:8090 on Immich's network (IMMICH_NETWORK, default immich_default:
# the network of Immich's own docker-compose project "immich").
name: tour-photos
services:
  photos-sync:
    container_name: photos-sync
    build: ./app
    image: tour-photos-service:1
    command: ["/app/sync.py"]
    env_file: config.env
    # Optional: Intel/AMD graphics speeds up video a lot. Delete these two lines if your NAS has no /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./data:/data        # state + your watermark.png
      - ./work:/work        # temporary files while a day is processed
    restart: unless-stopped
  photos-upload:
    container_name: photos-upload
    image: tour-photos-service:1
    depends_on: [photos-sync]
    command: ["/app/upload.py"]
    env_file: config.env
    environment:
      - LISTEN_PORT=8090
    volumes:
      - ./data:/data
      - ./work:/work
    ports:
      - "${UPLOAD_PORT:-8090}:8090"   # office upload page: http://<NAS address>:<UPLOAD_PORT>
    networks:
      default:
      immich:
        aliases: [tour-photos-upload]  # the https front (tls/) proxies to this name
    restart: unless-stopped
networks:
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
