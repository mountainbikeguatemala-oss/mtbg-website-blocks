# The holding page while Odoo restarts or updates (Edge Cache 0.6.7, deploy/README.md).
#
# Put these lines inside the HTTPS server block(s) of www.example.com on the server
# (/etc/nginx/sites-available/<the site>), next to the existing "location / { proxy_pass ... }".
# Visitors then get deploy/updating.html (English and Spanish) with HTTP 503 and Retry-After: 120 instead of a raw
# 502/504, both while Odoo is down (restart) and while it answers its own 503 (an update in progress).
# Cloudflare still answers the pages it keeps (tours, home, blog...) from its cache: with Odoo's stale-if-error
# header it does so even when a kept page's time has run out.

error_page 502 503 504 =503 /mtbg-updating.html;

location = /mtbg-updating.html {
    internal;                                   # never opened by its own address
    root /var/www/mtbg-updating;                # the folder holding updating.html, renamed mtbg-updating.html
    charset utf-8;
    add_header Retry-After 120 always;          # search engines: come back in 2 minutes, nothing is lost
    add_header Cache-Control "no-store" always; # neither Cloudflare nor a browser keeps it
}

# And ONE line inside the existing "location / { ... }" (the one with proxy_pass to Odoo), so Odoo's own 503
# during an update gets the same page:
#
#     proxy_intercept_errors on;
#
# (it only replaces the codes named by error_page above: 502, 503, 504; Odoo's 404 and other pages pass as they are)
